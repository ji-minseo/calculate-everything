name: SEO and calculator regression checks
on:
  pull_request:
    paths: ['**/*.html', 'assets/**', 'robots.txt', 'sitemap.xml', 'tests/**', '.github/workflows/seo.yml']
  push:
    branches: [main]
    paths: ['**/*.html', 'assets/**', 'robots.txt', 'sitemap.xml', 'tests/**', '.github/workflows/seo.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -s tests -p '*_test.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/tools.js && node --check assets/tools-ko.js
      - run: node --test tests/*.test.js
